# 阿里云访问凭证（支持 access_key_id/access_key_secret 或 access_id/access_secret）
access_id: "your-access-key-id"
access_secret: "your-access-key-secret"

# 域名配置
domain_name: "example.com"
rr: "home"
type: "A" # IPv4 用 A，IPv6 用 AAAA

# 刷新间隔与解析生效时间
redo: 60 # 单位：秒
ttl: 600

# 时区（用于容器内日志时区）
timezone: "Asia/Shanghai"

# 可选：区域与阿里云 DNS API endpoint
region_id: "cn-hangzhou"
endpoint: "alidns.cn-hangzhou.aliyuncs.com"

# 可选：公网 IP 获取地址（按顺序重试）
ip_sources:
  - "https://api.ipify.org"
  - "https://ifconfig.me/ip"
  - "https://ip.sb"
